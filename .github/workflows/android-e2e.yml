name: Android E2E smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro Android smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FF_API_BASE_URL: ${{ vars.FF_API_BASE_URL || 'http://10.0.2.2:5124' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> "${GITHUB_PATH}"

      - name: Resolve frontend dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build debug APK for E2E
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub \
            --dart-define=FF_SHOW_DEMO_LOGIN=true \
            --dart-define=FF_API_BASE_URL="${FF_API_BASE_URL}"

      - name: Run Maestro on a headless Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r frontend/build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          if-no-files-found: ignore
          path: |
            ~/.maestro/tests
            ~/.maestro/logs
