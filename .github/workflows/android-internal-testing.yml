name: Android internal testing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Build Android app
    runs-on: ubuntu-latest

    env:
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.example.ff' }}
      FF_API_BASE_URL: ${{ vars.FF_API_BASE_URL }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve frontend dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Calculate app version
        working-directory: frontend
        run: |
          set -euo pipefail
          version_line="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          build_name="${version_line%%+*}"
          build_number="${GITHUB_RUN_NUMBER}"
          echo "BUILD_NAME=${build_name}" >> "${GITHUB_ENV}"
          echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"
          echo "Building FF ${build_name}+${build_number}"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_values=(
            "${ANDROID_KEYSTORE_BASE64:-}"
            "${ANDROID_KEYSTORE_PASSWORD:-}"
            "${ANDROID_KEY_ALIAS:-}"
            "${ANDROID_KEY_PASSWORD:-}"
          )

          configured=0
          for value in "${signing_values[@]}"; do
            if [[ -n "${value}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "${configured}" -eq 0 ]]; then
            echo "::warning::Android signing secrets are not configured. The build artifact will be produced, but Play upload will be skipped."
            echo "HAS_ANDROID_SIGNING=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          if [[ "${configured}" -ne 4 ]]; then
            echo "::error::Configure all Android signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi

          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > frontend/android/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=upload-keystore.jks"
          } > frontend/android/key.properties
          echo "HAS_ANDROID_SIGNING=true" >> "${GITHUB_ENV}"

      - name: Check Play upload configuration
        run: |
          set -euo pipefail
          if [[ -n "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "HAS_PLAY_UPLOAD=true" >> "${GITHUB_ENV}"
          else
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not configured. Internal testing upload will be skipped."
            echo "HAS_PLAY_UPLOAD=false" >> "${GITHUB_ENV}"
          fi

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test --no-pub

      - name: Build release APK and app bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          dart_defines=()
          if [[ -n "${FF_API_BASE_URL:-}" ]]; then
            dart_defines+=(--dart-define="FF_API_BASE_URL=${FF_API_BASE_URL}")
          fi

          flutter build apk --release --no-pub \
            --build-name="${BUILD_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            "${dart_defines[@]}"

          flutter build appbundle --release --no-pub \
            --build-name="${BUILD_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            "${dart_defines[@]}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ff-android-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          if-no-files-found: error
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab

      - name: Publish to Google Play internal testing
        if: github.event_name == 'push' && env.HAS_ANDROID_SIGNING == 'true' && env.HAS_PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
